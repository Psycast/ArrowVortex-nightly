name: Daily Beta Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: uvcat7/ArrowVortex
  UPSTREAM_BRANCH: beta
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  check:
    name: "Check for upstream changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.compare.outputs.has_changes }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      last_sha: ${{ steps.compare.outputs.last_sha }}
    steps:
      - name: Get latest upstream SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git refs/heads/${{ env.UPSTREAM_BRANCH }} | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Get last built SHA from releases
        id: last_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(gh release list --repo ${{ github.repository }} --limit 1 --json name --jq '.[0].name // ""')
          SHA=$(echo "$NAME" | grep -oP '(?<=Nightly )[0-9a-f]{7}' || true)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Compare SHAs
        id: compare
        run: |
          UPSTREAM="${{ steps.upstream.outputs.sha }}"
          LAST="${{ steps.last_built.outputs.sha }}"
          echo "Upstream SHA: $UPSTREAM"
          echo "Last built SHA: $LAST"
          if [ "${UPSTREAM:0:7}" != "$LAST" ] && [ -n "$UPSTREAM" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          echo "upstream_sha=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "last_sha=$LAST" >> $GITHUB_OUTPUT

  build-windows:
    name: "Build Windows x64"
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout upstream beta branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}

      - name: Configure CMake
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DYML=YML

      - name: Build AV
        run: cmake --build build --config Release --parallel "$env:NUMBER_OF_PROCESSORS"

      - name: Collect into a directory
        run: cmake --install build --config Release --prefix ./

      - name: Zip artifacts
        shell: pwsh
        run: |
          $sha = "${{ needs.check.outputs.upstream_sha }}".Substring(0, 7)
          Compress-Archive -Path bin/assets, bin/noteskins, bin/settings, bin/ArrowVortex.exe `
            -DestinationPath "ArrowVortex-beta-windows-$sha.zip"

      - name: Upload zip
        uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: ArrowVortex-beta-windows-*.zip
          if-no-files-found: error

  build-linux:
    name: "Build Linux x64"
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout upstream beta branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}

      - name: Install dependencies
        run: |
          sudo apt-get install -qq -y mono-devel nasm libltdl-dev \
            autoconf autoconf-archive automake libtool \
            libx11-dev libxft-dev libxext-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libibus-1.0-dev zenity clang-tidy clang-format build-essential git \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libusb-1.0-0-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev fcitx-libs-dev \
            libasound2-dev libdecor-0-dev python3-venv libthai-dev libpipewire-0.3-dev \
            liburing-dev

      - name: Configure CMake
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DPRESET_NAME=linux-release
          -DYML=YML

      - name: Build AV
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Collect into a directory
        run: cmake --install build --config Release --prefix ./

      - name: Zip artifacts
        run: |
          SHA="${{ needs.check.outputs.upstream_sha }}"
          SHORT="${SHA:0:7}"
          zip -r "ArrowVortex-beta-linux-$SHORT.zip" bin/assets bin/noteskins bin/settings bin/ArrowVortex

      - name: Upload zip
        uses: actions/upload-artifact@v5
        with:
          name: linux-zip
          path: ArrowVortex-beta-linux-*.zip
          if-no-files-found: error

  release:
    name: "Create GitHub Release"
    needs: [check, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Download Linux zip
        uses: actions/download-artifact@v4
        with:
          name: linux-zip
          path: dist

      - name: Set padded run number
        id: run_number
        run: |
          printf 'value=%05d\n' "${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Release Notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ needs.check.outputs.upstream_sha }}"
          LAST="${{ needs.check.outputs.last_sha }}"
          SHORT="${SHA:0:7}"
          REPO_URL="https://github.com/${{ env.UPSTREAM_REPO }}"

          > release_notes.md

          if [ -n "$LAST" ]; then
            gh api "repos/${{ env.UPSTREAM_REPO }}/compare/${LAST}...${SHA}" \
              --jq ".commits[] | \"- [\(.commit.message | split(\"\\n\")[0])](${REPO_URL}/commit/\(.sha))\"" \
              >> release_notes.md
          else
            gh api "repos/${{ env.UPSTREAM_REPO }}/commits/${SHA}" \
              --jq "\"- [\(.commit.message | split(\"\\n\")[0])](${REPO_URL}/commit/\(.sha))\"" \
              >> release_notes.md
          fi

          printf '\n---\n\n' >> release_notes.md

          if [ -n "$LAST" ]; then
            printf '[Compare %s → %s](%s/compare/%s...%s)\n' "$LAST" "$SHORT" "$REPO_URL" "$LAST" "$SHA" >> release_notes.md
          else
            printf '(no previous build to compare against)\n' >> release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ needs.check.outputs.upstream_sha }}"
          DATE=$(date -u '+%Y-%m-%d')
          RUN="${{ steps.run_number.outputs.value }}"
          gh release create "build-$RUN-$SHA" \
            --repo "${{ github.repository }}" \
            --title "ArrowVortex Nightly ${SHA:0:7} ($DATE)" \
            --notes-file release_notes.md \
            dist/ArrowVortex-beta-windows-*.zip \
            dist/ArrowVortex-beta-linux-*.zip